server:
  port: 8080

spring:
  application:
    name: pharmacy-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/hospital
    username: admin
    password: pass
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.hospital.pharmacy: DEBUG

app:
  jwt:
    issuer: pharmacy-backend
    secret: 0123456789abcdef0123456789abcdef
    expiration-minutes: 180
  rate-limit:
    requests-per-minute: 120

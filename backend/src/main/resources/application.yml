server:
  port: ${PORT:8080}

spring:
  application:
    name: pharmacy-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hospital}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:pass}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.hospital.pharmacy: DEBUG

app:
  jwt:
    issuer: pharmacy-backend
    secret: 0123456789abcdef0123456789abcdef
    expiration-minutes: 180
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  rate-limit:
    requests-per-minute: 120
  ai:
    groq:
      api-key: ${GROQ_API_KEY:}
      model: llama-3.3-70b-versatile
      base-url: https://api.groq.com/openai/v1
    openfda:
      base-url: https://api.fda.gov/drug
    fallback-to-mock: true
